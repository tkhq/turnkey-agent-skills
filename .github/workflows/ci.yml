name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build pinned tk
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/tkhq/tk "$RUNNER_TEMP/tk"
          rustup toolchain install 1.95.0 --profile minimal
          cd "$RUNNER_TEMP/tk"
          cargo +1.95.0 build --locked -p turnkey_tk --bin tk
          echo "TK_CLI_BINARY=$RUNNER_TEMP/tk/target/debug/tk" >> "$GITHUB_ENV"

      - name: Test
        run: npm test
