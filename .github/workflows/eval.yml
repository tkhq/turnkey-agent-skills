name: Skill Evals

on:
  pull_request:
    paths:
      - "skills/**"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run validate

  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - creating-skills
          - managing-wallets-api
          - managing-private-keys-api
          - signing-transactions-api
          - managing-policies-api
          - monitoring-activities-api
          - managing-users-api
          - managing-organizations-api
          - agentic-wallet-workflow
          - treasury-operations-workflow
          - getting-started-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Check API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run trigger eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_INTERACTIVITY: "1"
        run: npm run eval -- --skill ${{ matrix.skill }} --threshold 90 --concurrency 4
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.skill }}
          path: skills/${{ matrix.skill }}/evals/trigger-results.json

  summary:
    runs-on: ubuntu-latest
    needs: [validate, eval]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-results-*
          path: results
      - name: Generate summary
        run: |
          echo "## Skill Eval Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Skill | Accuracy | Trigger Accuracy | False Positive Rate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|------------------|---------------------|--------|" >> $GITHUB_STEP_SUMMARY
          for dir in results/eval-results-*/; do
            f="${dir}trigger-results.json"
            [ -f "$f" ] || continue
            skill=$(jq -r '.skill' "$f")
            acc=$(jq -r '.summary.accuracy' "$f")
            tacc=$(jq -r '.summary.triggerAccuracy' "$f")
            fpr=$(jq -r '.summary.falsePositiveRate' "$f")
            status=$(jq -r 'if .summary.accuracy >= 90 then "PASS" else "FAIL" end' "$f")
            echo "| ${skill} | ${acc}% | ${tacc}% | ${fpr}% | ${status} |" >> $GITHUB_STEP_SUMMARY
          done
      - name: Check for failures
        run: |
          if [ "${{ needs.eval.result }}" = "failure" ]; then
            echo "One or more skill evals failed the 90% threshold"
            exit 1
          fi
