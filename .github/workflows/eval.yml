name: Skill Evals

on:
  pull_request:
    paths:
      - ".github/workflows/eval.yml"
      - "scripts/**"
      - "skills/**"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Check API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Determine which skills to evaluate
        id: scope
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Check if any SKILL.md or scripts changed (affects all skills)
            global_changes=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- scripts/ | wc -l)
            skill_md_changes=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'skills/*/SKILL.md' | wc -l)

            if [[ "$global_changes" -gt 0 || "$skill_md_changes" -gt 0 ]]; then
              echo "mode=all" >> "$GITHUB_OUTPUT"
              echo "Running all skills (scripts or SKILL.md changed)"
            else
              # Only eval-specific files changed, find which skills
              changed_skills=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- skills/ \
                | grep -oP '^skills/\K[^/]+' \
                | sort -u \
                | tr '\n' ' ')
              if [[ -n "$changed_skills" ]]; then
                echo "mode=changed" >> "$GITHUB_OUTPUT"
                echo "skills=$changed_skills" >> "$GITHUB_OUTPUT"
                echo "Running changed skills only: $changed_skills"
              else
                echo "mode=all" >> "$GITHUB_OUTPUT"
                echo "No skill changes detected, running all"
              fi
            fi
          else
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "Running all skills (push to main or manual dispatch)"
          fi

      - name: Run trigger evals (all skills)
        if: steps.scope.outputs.mode == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval:all -- --threshold 85 --concurrency 8

      - name: Run trigger evals (changed skills only)
        if: steps.scope.outputs.mode == 'changed'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for skill in ${{ steps.scope.outputs.skills }}; do
            echo "--- Evaluating $skill ---"
            npm run eval -- --skill "$skill" --threshold 85 --concurrency 8
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: skills/*/evals/trigger-results.json

      - name: Generate summary
        if: always()
        run: |
          echo "## Skill Eval Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Skill | Accuracy | Trigger Accuracy | False Positive Rate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|------------------|---------------------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in skills/*/evals/trigger-results.json; do
            [ -f "$f" ] || continue
            skill=$(jq -r '.skill' "$f")
            acc=$(jq -r '.summary.accuracy' "$f")
            tacc=$(jq -r '.summary.triggerAccuracy' "$f")
            fpr=$(jq -r '.summary.falsePositiveRate' "$f")
            status=$(jq -r 'if .summary.accuracy >= 90 then "PASS" else "FAIL" end' "$f")
            echo "| ${skill} | ${acc}% | ${tacc}% | ${fpr}% | ${status} |" >> $GITHUB_STEP_SUMMARY
          done
