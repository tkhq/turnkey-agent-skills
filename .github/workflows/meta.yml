name: meta

# Cancel any previous runs of this workflow for a given PR or release tag
concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # Allows manual invocation

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Ensure third-party actions are pinned to commit SHAs
        # ensure we're searching for both .yml and .yaml, ignoring filename captialization
        run: |
          result=$( \
            find .github -iname '*.yml' -o -iname '*.yaml' | \
            xargs grep -Ei 'uses:\s*[a-z0-9_.-]+\/[a-z0-9_.-]+@' | \
            grep -Eiv '@[a-z0-9]{40}' | \
            cat \
          )

          if [[ -z "$result" ]]
          then
            echo "Validated all third-party actions"
          else
            echo "Error: third-party GitHub actions MUST be pinned to a commit SHA. See ./github/workflows/README.md"
            echo "$result"
            exit 1
          fi
